name: Docker

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - main
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Smoke Test
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: lunarr-app:latest

      - name: Run Docker container
        run: |
          docker run -d \
            -p 3000:3000 \
            -e AUTH_SECRET=lunarr-ci-secret-value-that-is-at-least-32-chars \
            -e ORIGIN=http://127.0.0.1:3000 \
            --name lunarr-container \
            lunarr-app:latest

      - name: Smoke test
        run: |
          last_error="$(mktemp)"
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/setup > /dev/null 2>"$last_error"; then
              exit 0
            fi
            sleep 1
          done
          cat "$last_error"
          docker ps -a
          docker logs lunarr-container
          exit 1

      - name: Stop and remove container
        if: always()
        run: docker rm -f lunarr-container || true
