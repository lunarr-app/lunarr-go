name: Docker Edge

# Required repo configuration:
#   Secrets:  DOCKERHUB_TOKEN
#   Variables: DOCKERHUB_USERNAME (e.g. sayem314)

on:
  workflow_run:
    workflows:
      - Docker Test
    branches:
      - main
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-edge-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: true

env:
  IMAGE: sayem314/lunarr
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  docker:
    name: Build and Push Edge Image
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Resolve source revision
        id: source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          should_build="true"
          if [[ "${EVENT_NAME}" == "workflow_run" ]]; then
            latest_sha="$(git ls-remote "https://github.com/${REPOSITORY}.git" refs/heads/main | awk '{print $1}')"
            if [[ -z "${latest_sha}" ]]; then
              echo "Could not resolve latest main SHA." >&2
              exit 1
            fi
            if [[ "${SOURCE_SHA}" != "${latest_sha}" ]]; then
              echo "Skipping stale Docker edge source ${SOURCE_SHA}; main is ${latest_sha}."
              should_build="false"
            fi
          fi
          {
            echo "sha=${SOURCE_SHA}"
            echo "should_build=${should_build}"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        if: steps.source.outputs.should_build == 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.source.outputs.sha }}

      - name: Set up QEMU
        if: steps.source.outputs.should_build == 'true'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: steps.source.outputs.should_build == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: steps.source.outputs.should_build == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve edge version
        if: steps.source.outputs.should_build == 'true'
        id: edge
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: echo "version=edge-${SOURCE_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker edge image
        if: steps.source.outputs.should_build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: |
            ${{ env.IMAGE }}:edge
          build-args: |
            LUNARR_APP_VERSION=${{ steps.edge.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
