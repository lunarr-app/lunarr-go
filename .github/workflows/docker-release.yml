name: Docker Release

# Required repo configuration:
#   Secrets:  DOCKERHUB_TOKEN
#   Variables: DOCKERHUB_USERNAME (e.g. sayem314)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Docker version tag. Defaults to package.json version."
        required: false
        default: ""
      push_latest:
        description: "Also push the latest tag"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

concurrency:
  group: docker-release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: sayem314/lunarr
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  verify:
    name: Check, Test, and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check
        run: bun run check

      - name: Build
        run: bun run build

      - name: Test
        run: bun run test

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve Docker metadata
        id: release
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_PUSH_LATEST: ${{ github.event.inputs.push_latest }}
        run: |
          package_version="$(node -p "require('./package.json').version")"

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            push_latest="true"
            if [[ "${version}" != "${package_version}" ]]; then
              echo "Tag version ${version} does not match package.json version ${package_version}." >&2
              exit 1
            fi
          else
            version="${INPUT_VERSION:-$package_version}"
            push_latest="${INPUT_PUSH_LATEST:-false}"
          fi

          {
            echo "version=${version#v}"
            echo "push_latest=${push_latest}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker tags
        id: tags
        shell: bash
        run: |
          version="${{ steps.release.outputs.version }}"
          tags="${IMAGE}:${version}"
          if [[ "${{ steps.release.outputs.push_latest }}" == "true" ]]; then
            tags="${tags}"$'\n'"${IMAGE}:latest"
          fi
          {
            echo "tags<<EOF"
            echo "${tags}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            LUNARR_APP_VERSION=${{ steps.release.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
